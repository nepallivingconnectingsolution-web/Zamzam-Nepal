<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04342C" />
    <title>Zamzam — Nepal's everything app for mobility, logistics & travel</title>
    <meta name="description" content="One app for taxis, bikes, intercity buses, freight, hotels and tours across Nepal. One identity, one wallet, one assistant — built marketplace-first." />
    <meta property="og:title" content="Zamzam Super App" />
    <meta property="og:description" content="Nepal's AI-powered mobility, logistics, tourism and commerce marketplace." />
    <meta property="og:type" content="website" />
    <!-- Fonts are self-hosted via @fontsource (imported in main.tsx) — no
         CDN round-trip on cold app launch, and it still works offline once
         the native shell has the assets bundled. -->
  </head>
  <body>
    <!-- #boot: the first painted frame. Matches the SplashScreen's deep-teal
         ground exactly, so there's no white flash between the native launch
         and React mounting. React clears #root on render, removing this
         seamlessly as the animated splash (same ground) takes over. -->
    <div id="root">
      <div style="position:fixed;inset:0;background:radial-gradient(120% 92% at 50% 8%, #0A4A3D 0%, #04342C 46%, #021B16 100%)"></div>
    </div>
    <div id="print-root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
